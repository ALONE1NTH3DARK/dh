<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="DARKHORSE WEBAGENCY — создаём современные продающие сайты под ключ: стратегия, дизайн, разработка и рост конверсии." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <title>DARKHORSE WEBAGENCY — продающие сайты под ключ</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#06040a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600;800&family=Onest:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <script>
    try {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      const hist = history.state;
      if (hist?.usr?.scrollTo) {
        history.replaceState({ ...hist, usr: { ...hist.usr, scrollTo: undefined } }, "");
      }
      const stored = localStorage.getItem("dh_theme");
      const hour = new Date().getHours();
      const theme =
        stored === "light" || stored === "dark"
          ? stored
          : hour >= 6 && hour < 18
            ? "light"
            : "dark";
      if (theme === "light") {
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.colorScheme = "light";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#f4f1fa");
      }
    } catch (e) {}
  </script>
  <body>
    <div id="root"></div>
    <noscript>
      DARKHORSE WEBAGENCY — продающие сайты под ключ: стратегия, дизайн, разработка
      и рост конверсии. Для просмотра сайта включите JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
